<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; media-src blob:; object-src 'none'; base-uri 'self'"><title>ComicPod 手機操作預覽</title><link rel="stylesheet" href="./style.css?v=V0.5-phone.1"><script src="./browser-store.js?v=V0.5-phone.1" defer></script><script src="./app.js?v=V0.5-phone.1" defer></script><script src="./render.js?v=V0.5-phone.1" defer></script><script src="./frames.js?v=V0.5-phone.1" defer></script><script src="./audio.js?v=V0.5-phone.1" defer></script><script src="./text-import.js?v=V0.5-phone.1" defer></script><script src="./story.js?v=V0.5-phone.1" defer></script><script src="./finish.js?v=V0.5-phone.1" defer></script></head>
<body><header><a href="#home" class="brand">◒ ComicPod <small>豆莢浪漫</small></a><span class="badge" data-t="local"></span><button id="identity" hidden></button></header>
<main><section id="home"><h1 data-t="headline"></h1><p data-t="intro"></p><div class="actions"><button id="startGrid" class="primary">上傳一張 2×2 合圖</button><button id="startFour" class="primary">上傳四張圖</button><button id="mine" data-t="mine"></button></div><p id="uploadHint">用自己的圖片開始，或從「我的草稿」續做。圖片不上傳，草稿保存在這台裝置的瀏覽器。本輪可試播，尚未提供MP4下載。</p><input id="homeGrid" type="file" accept="image/png,image/jpeg,image/webp" hidden><input id="homeFour" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden><details id="maintenance" hidden><summary>備份與工程工具</summary><div class="actions"><button id="new" data-t="new"></button><label class="button"><span data-t="import"></span><input id="package" type="file" accept=".zip" hidden></label></div></details></section>
<div id="status" role="status" aria-live="polite"></div><section id="identities" hidden></section><section id="drafts" hidden></section>
<section id="editor" hidden><nav aria-label="創作步驟"><button id="bean1" aria-current="step">豆一　漫畫素材</button><button id="bean2">豆二　故事腳本</button><button id="bean3">豆三　背景配樂</button><button id="bean4">豆四　影片</button></nav>
<div class="heading"><h2 id="stepTitle" data-t="bean1"></h2><div class="actions"><button id="save" class="primary" data-t="save"></button><button hidden id="export" data-t="export"></button></div></div>
<label><span data-t="title"></span><input id="title" maxlength="100"></label><div id="materials"><div class="actions"><label class="button"><span data-t="four"></span><input id="four" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden></label><label class="button"><span data-t="grid"></span><input id="grid" type="file" accept="image/png,image/jpeg,image/webp" hidden></label></div>
<p class="muted" data-t="order"></p><p>每格可選完整顯示或鋪滿畫面。完整顯示保留整張；鋪滿畫面可能裁掉邊緣，原圖都會保留。</p><div id="panels"></div><button id="toStory" class="primary">確認圖片，去豆二寫台詞 →</button></div><section id="story" hidden></section><p id="draftMeta" class="muted"></p><input id="replace" type="file" accept="image/png,image/jpeg,image/webp" hidden></section>
<footer><p data-t="boundary"></p><button hidden id="stop" data-t="stop"></button><p id="location" class="muted"></p></footer></main></body></html>
